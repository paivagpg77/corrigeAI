<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — CorrigeAI</title>
    <link rel="stylesheet" href="../css/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cadastro-container">

        <!-- Left Side - Branding -->
        <div class="cadastro-brand" style="justify-content: center; align-items: center;">
            <div class="brand-content">
                <svg width="80" height="80" viewBox="0 0 40 40" fill="none" style="display: block; margin: 0 auto 20px;">
                    <rect width="40" height="40" rx="12" fill="#FFFFFF"/>
                    <path d="M12 20C12 15.58 15.58 12 20 12C24.42 12 28 15.58 28 20" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="20" cy="20" r="3" fill="#10B981"/>
                </svg>
                <h1>CorrigeAI</h1>
                <p>Correção Inteligente de Provas</p>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="cadastro-form-container">
            <form id="cadastroForm" class="cadastro-form">
                <div class="form-header">
                    <h2>Criar conta</h2>
                    <p>Cadastre-se para começar a usar o CorrigeAI.</p>
                </div>

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo de usuário</label>
                    <select id="tipo" required>
                        <option value="">Selecione</option>
                        <option value="PROFESSOR">Professor</option>
                        <option value="COORDENADOR">Coordenador</option>
                        <option value="DIRETOR">Diretor</option>
                    </select>
                </div>

                <button type="submit" class="btn-cadastrar">Criar conta</button>

                <p id="mensagem"></p>

                <div class="voltar">
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </div>
            </form>
        </div>

    </div>

<script>
    const form = document.getElementById("cadastroForm");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;
        const tipo = document.getElementById("tipo").value;

        mensagem.textContent = "Cadastrando...";
        mensagem.className = "";

        try {
            const resposta = await fetch(
                "http://localhost:3000/api/auth/cadastro",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: nome,
                        email: email,
                        senha: senha,
                        tipo: tipo
                    })
                }
            );

            const dados = await resposta.json();

            if (!resposta.ok) {
                throw new Error(
                    dados.mensagem || "Erro ao realizar cadastro."
                );
            }

            mensagem.textContent = "Conta criada com sucesso!";
            mensagem.className = "sucesso";

            form.reset();

        } catch (error) {
            console.error("Erro no cadastro:", error);

            mensagem.textContent = error.message;
            mensagem.className = "erro";
        }
    });
</script>

</body>
</html>
